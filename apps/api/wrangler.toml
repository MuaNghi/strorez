name = "store"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Worker phục vụ luôn frontend (build từ apps/web), chỉ /api/* chạy qua Worker
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Tạo thật khi deploy:
#   npx wrangler d1 create store-db      -> điền database_id
#   npx wrangler kv namespace create CART -> điền id
[[d1_databases]]
binding = "DB"
database_name = "store-db"
database_id = "34aa5f15-0ecd-4ff0-bc91-e8d45383a71c"

[[kv_namespaces]]
binding = "CART"
id = "8ecbf1bce84942e98f05820849d1c19f"
